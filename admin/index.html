<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | FKC Institute of Computer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div style="text-align:center;margin-bottom:1.5rem;">
        <div class="logo-icon" style="margin:0 auto 1rem;width:56px;height:56px;font-size:1.4rem;">FKC</div>
        <h2>Admin Panel</h2>
        <p class="subtitle">FKC Institute of Computer</p>
      </div>
      
      <div id="loginError" style="display:none;background:#FEE2E2;color:#991B1B;padding:0.85rem 1rem;border-radius:8px;margin-bottom:1.25rem;font-size:0.9rem;"></div>
      
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminUser">Username</label>
          <input type="text" id="adminUser" class="form-control" required placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="adminPass">Password</label>
          <input type="password" id="adminPass" class="form-control" required placeholder="Enter password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <i class="fas fa-lock"></i> Secure Login
        </button>
      </form>
      
      <p style="text-align:center;margin-top:1.5rem;font-size:0.85rem;color:var(--gray);">
        Demo credentials: <strong>admin</strong> / <strong>fkc2026</strong>
      </p>
      <p style="text-align:center;margin-top:0.75rem;">
        <a href="../index.html" style="color:var(--primary);font-size:0.9rem;"><i class="fas fa-arrow-left"></i> Back to Website</a>
      </p>
    </div>
  </div>
  <script src="../js/script.js"></script>
</body>
</html>
